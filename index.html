<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024年日历 - 第几周查询</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>2024年日历</h1>
            <div class="controls">
                <button id="prevMonth">上个月</button>
                <span id="currentMonthDisplay"></span>
                <button id="nextMonth">下个月</button>
            </div>
        </header>

        <div class="calendar-container">
            <div id="calendar"></div>
        </div>

        <div class="info-panel">
            <h3>今日信息</h3>
            <p id="todayInfo"></p>
        </div>
    </div>

    <script src="calendar.js"></script>
</body>
</html>

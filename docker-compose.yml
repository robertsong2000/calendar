version: '3.8'

services:
  calendar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calendar-web-app
    ports:
      - "5003:80"
    restart: unless-stopped
    labels:
      - "com.calendar-app.description=2024年日历应用"
      - "com.calendar-app.version=1.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加监控服务
  nginx-proxy:
    image: nginx:alpine
    container_name: calendar-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - calendar-app
    restart: unless-stopped
    profiles:
      - proxy

  # 可选：添加日志收集
  logrotate:
    image: alpine:latest
    container_name: calendar-logrotate
    volumes:
      - ./logs:/logs
    command: >
      sh -c "
        while true; do
          sleep 86400
          find /logs -name '*.log' -mtime +7 -delete
        done
      "
    restart: unless-stopped
    profiles:
      - logging

volumes:
  calendar-logs:
    driver: local